# Testes a cada push e pull request. O deploy no Render so acontece depois
# que este pipeline fica verde (ver .github/workflows/deploy.yml).

name: testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gateway:
    name: gateway (gemeo digital do circuito)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: instalar pytest
        run: pip install pytest
      - name: rodar a suite
        working-directory: gateway
        # Inclui a prova de equivalencia contra o proprio .circ: se alguem
        # mexer no circuito e esquecer o Python (ou vice-versa), quebra aqui.
        run: python -m pytest -v

  backend:
    name: backend (API, dominio e demo ponta a ponta)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: instalar o pacote e as dependencias de teste
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: rodar a suite
        working-directory: backend
        # test_ponta_a_ponta.py sobe a API de verdade e roda o gateway real
        # contra ela; por isso o checkout precisa das duas pastas.
        run: python -m pytest -v
