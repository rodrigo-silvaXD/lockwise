# Deploy no Render, so depois que os testes passam.
#
# Precisa de dois segredos no repositorio (Settings > Secrets and variables >
# Actions), ambos vindos do painel do Render:
#   RENDER_DEPLOY_HOOK_URL  Settings do servico > Deploy Hook
#   LOCKWISE_API_URL        a URL publica, ex.: https://lockwise-api.onrender.com
#
# Sem eles o job nao falha: avisa o que falta e termina. Assim o pipeline nao
# fica vermelho enquanto a infraestrutura nao existe.

name: deploy

on:
  workflow_run:
    workflows: [testes]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: publicar no Render e conferir a saude
    runs-on: ubuntu-latest
    # workflow_run dispara mesmo quando os testes falham; este if e o portao.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run nao traz o commit do push; pegamos o que o evento aponta.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: conferir se os segredos existem
        id: segredos
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          URL: ${{ secrets.LOCKWISE_API_URL }}
        run: |
          if [ -z "$HOOK" ] || [ -z "$URL" ]; then
            echo "configurado=nao" >> "$GITHUB_OUTPUT"
            echo "::notice::Faltam os segredos RENDER_DEPLOY_HOOK_URL e/ou LOCKWISE_API_URL. Deploy ignorado."
          else
            echo "configurado=sim" >> "$GITHUB_OUTPUT"
          fi

      - name: descobrir qual commit deve ir para o ar
        if: steps.segredos.outputs.configurado == 'sim'
        id: alvo
        # A SHA do commit e o que confirma que o deploy trocou o que esta
        # rodando. Checar "status: ok" aprovaria a versao antiga, que responde
        # isso enquanto a nova e construida; checar __version__ so funciona se
        # alguem lembrar de troca-la a cada mudanca. A SHA muda sempre.
        # O Render injeta RENDER_GIT_COMMIT no servico, e /health devolve.
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Commit esperado no ar apos o deploy: $sha"

      - name: pedir o deploy ao Render
        if: steps.segredos.outputs.configurado == 'sim'
        run: curl --fail --silent --show-error "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: esperar a API responder com o commit novo
        if: steps.segredos.outputs.configurado == 'sim'
        env:
          URL: ${{ secrets.LOCKWISE_API_URL }}
          ESPERADO: ${{ steps.alvo.outputs.sha }}
        # O plano gratuito hiberna e o build leva alguns minutos; tentamos por
        # ate 10 minutos antes de desistir.
        run: |
          for tentativa in $(seq 1 60); do
            resposta=$(curl --silent --max-time 30 "$URL/health" || true)
            if echo "$resposta" | grep -q "\"commit\":\"$ESPERADO\""; then
              echo "No ar com o commit $ESPERADO: $resposta"
              # Postgres em producao; SQLite aqui seria disco efemero.
              if ! echo "$resposta" | grep -q '"persistente":true'; then
                echo "::error::A API subiu, mas sem banco persistente. Confira DATABASE_URL no painel do Render."
                exit 1
              fi
              exit 0
            fi
            echo "tentativa $tentativa/60 - ainda nao: ${resposta:-sem resposta}"
            sleep 10
          done
          echo "::error::A API nao chegou no commit $ESPERADO em 10 minutos. Veja os logs do servico no Render."
          exit 1
