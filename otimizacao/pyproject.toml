[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lockwise-otimizacao"
version = "0.1.0"
description = "Modelo de cobertura para a escala de vigilancia do LOCKWISE"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pulp>=2.8",
    # zoneinfo nao acompanha base de fusos no Windows
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lockwise-otimizar = "lockwise_otimizacao.cli:main"

[tool.setuptools.packages.find]
include = ["lockwise_otimizacao*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
