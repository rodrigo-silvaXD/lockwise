[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lockwise-gateway"
version = "0.1.0"
description = "Gêmeo digital do circuito LOCKWISE e ponte para a API na nuvem"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lockwise-gateway = "lockwise_gateway.cli:main"

[tool.setuptools.packages.find]
include = ["lockwise_gateway*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
