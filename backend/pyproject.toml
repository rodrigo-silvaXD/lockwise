[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lockwise-api"
version = "0.2.0"
description = "API do LOCKWISE: recebe eventos do gateway, persiste o histórico e expõe demanda horária e estado da fechadura"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2",
    # zoneinfo nao acompanha base de fusos no Windows; sem isto, a demanda
    # horaria e a politica de janela quebram fora do Linux. Estava vindo de
    # carona no psycopg, que e um extra opcional.
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["lockwise_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
